<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="760" height="327" role="img" aria-label="Each week broke a sound primitive by leaving out one check. Week 4: CBC has no tag. Week 5: Diffie-Hellman does not say who answers. Week 6: a check that answers differently leaks. Week 10: a repeated nonce. Week 11: a signature has a twin. Week 12: the certificate was not checked. Week 13: the server can read. Week 14: the password lands in the log. Week 15: a one-time key used twice.">
  <title>One pattern, nine weeks</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">The same story every week: a good primitive, one missing piece</text>
  <rect class="b" x="40" y="60" width="300" height="100" rx="10"/>
  <text class="tb" x="190" y="88">Week 4</text>
  <text class="t" x="190" y="118">CBC</text>
  <text class="ts" x="190" y="144">no tag</text>
  <rect class="b" x="350" y="60" width="300" height="100" rx="10"/>
  <text class="tb" x="500" y="88">Week 5</text>
  <text class="t" x="500" y="118">Diffie-Hellman</text>
  <text class="ts" x="500" y="144">who answers?</text>
  <rect class="b" x="660" y="60" width="300" height="100" rx="10"/>
  <text class="tb" x="810" y="88">Week 6</text>
  <text class="t" x="810" y="118">AEAD</text>
  <text class="ts" x="810" y="144">chatty errors</text>
  <rect class="bo" x="40" y="175" width="300" height="100" rx="10"/>
  <text class="to" x="190" y="203">Week 10</text>
  <text class="t" x="190" y="233">AES-GCM</text>
  <text class="ts" x="190" y="259">nonce repeats</text>
  <rect class="bo" x="350" y="175" width="300" height="100" rx="10"/>
  <text class="to" x="500" y="203">Week 11</text>
  <text class="t" x="500" y="233">ECDSA</text>
  <text class="ts" x="500" y="259">signature has a twin</text>
  <rect class="bo" x="660" y="175" width="300" height="100" rx="10"/>
  <text class="to" x="810" y="203">Week 12</text>
  <text class="t" x="810" y="233">TLS</text>
  <text class="ts" x="810" y="259">certificate not checked</text>
  <rect class="br" x="40" y="290" width="300" height="100" rx="10"/>
  <text class="tr" x="190" y="318">Week 13</text>
  <text class="t" x="190" y="348">HTTPS</text>
  <text class="ts" x="190" y="374">server can read</text>
  <rect class="br" x="350" y="290" width="300" height="100" rx="10"/>
  <text class="tr" x="500" y="318">Week 14</text>
  <text class="t" x="500" y="348">login</text>
  <text class="ts" x="500" y="374">password in the log</text>
  <rect class="br" x="660" y="290" width="300" height="100" rx="10"/>
  <text class="tr" x="810" y="318">Week 15</text>
  <text class="t" x="810" y="348">Lamport</text>
  <text class="ts" x="810" y="374">key used twice</text>
  <text class="tm" x="500" y="418">failure = primitive_ok and check_missing</text>
</svg>
