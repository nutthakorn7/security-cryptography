<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="760" height="236" role="img" aria-label="One idea from each early week. Week 1 threat model: assets, attacker, boundary. Week 2: salted slow hash. Week 3: a MAC is HMAC of key and message, not a hash of key plus message. Week 4: check the tag before trusting. Week 5: put a tag on the public value. Week 6: one failure answer.">
  <title>Callbacks: one idea from each of Weeks 1 to 6</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">Callbacks: one idea from each early week</text>
  <rect class="b" x="40" y="55" width="300" height="100" rx="10"/>
  <text class="tb" x="190.0" y="83">Week 1</text>
  <text class="tm" x="190.0" y="109.0">threat model</text>
  <text class="ts" x="190.0" y="137">assets · attacker · boundary</text>
  <rect class="b" x="350" y="55" width="300" height="100" rx="10"/>
  <text class="tb" x="500.0" y="83">Week 2</text>
  <text class="tm" x="500.0" y="109.0">hash + salt</text>
  <text class="ts" x="500.0" y="137">KDF(salt, password)</text>
  <rect class="b" x="660" y="55" width="300" height="100" rx="10"/>
  <text class="tb" x="810.0" y="83">Week 3</text>
  <text class="tm" x="810.0" y="109.0">MAC</text>
  <text class="ts" x="810.0" y="137">HMAC(k, m), not H(k + m)</text>
  <rect class="b" x="40" y="165" width="300" height="100" rx="10"/>
  <text class="tb" x="190.0" y="193">Week 4</text>
  <text class="tm" x="190.0" y="219.0">AES modes</text>
  <text class="ts" x="190.0" y="247">t' == tag(k, nonce, c') ?</text>
  <rect class="b" x="350" y="165" width="300" height="100" rx="10"/>
  <text class="tb" x="500.0" y="193">Week 5</text>
  <text class="tm" x="500.0" y="219.0">key exchange</text>
  <text class="ts" x="500.0" y="247">a tag on the public value</text>
  <rect class="b" x="660" y="165" width="300" height="100" rx="10"/>
  <text class="tb" x="810.0" y="193">Week 6</text>
  <text class="tm" x="810.0" y="219.0">AEAD</text>
  <text class="ts" x="810.0" y="247">open(...) = p or FAIL</text>
  <text class="ts" x="500" y="290">Each callback asks for the idea, in your own words</text>
</svg>
